[package]
name = "arena"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
oracle = { path = "../oracle" }
rwa-adapter = { path = "../rwa-adapter" }
payout = { path = "../payout" }
factory = { path = "../factory" }
