[workspace]
resolver = "2"
members = [
    "arena",
    "cost-bench",
    "factory",
    "fee-router",
    "oracle",
    "payout",
    "rwa-adapter",
    "staking",
]

[workspace.dependencies]
soroban-sdk = "22"

# cargo-llvm-cov sets `coverage_nightly` on nightly toolchains; inline test
# modules use it to opt out of coverage metrics (#1651, docs/COVERAGE.md).
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true
