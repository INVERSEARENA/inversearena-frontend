;; PgBouncer configuration for InverseArena
;; Transaction pooling mode for optimal connection reuse

[databases]
; Connection string format: dbname = host=hostname port=5432 dbname=database
; Replace with actual production values
inversearena = host=postgres port=5432 dbname=inversearena

[pgbouncer]

;;; Administrative settings

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

;;; Connection pooling mode
;;; - transaction: connection returned to pool after transaction ends (RECOMMENDED)
;;; - session: connection returned after client disconnects (supports LISTEN/NOTIFY)
;;; - statement: connection returned after every SQL statement (most aggressive)

pool_mode = transaction

;;; Listen address/port

listen_addr = 0.0.0.0
listen_port = 6432

;;; Authentication

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;;; Connection limits

; Maximum number of client connections
max_client_conn = 1000

; Default pool size per user/database pair
default_pool_size = 25

; Minimum pool size (reserved connections)
min_pool_size = 10

; Additional connections for reserve pool
reserve_pool_size = 5

; How long to wait for a reserved connection (seconds)
reserve_pool_timeout = 3

; Maximum connections to a single database
max_db_connections = 100

; Maximum connections for a single user
max_user_connections = 100

;;; Timeouts

; Server idle timeout (seconds) - close server connection if idle
server_idle_timeout = 600

; Server lifetime (seconds) - close and reconnect server connection
server_lifetime = 3600

; Server connect timeout (seconds)
server_connect_timeout = 15

; Query timeout (seconds) - kill queries that take longer
query_timeout = 30

; Query wait timeout (seconds) - how long clients can wait for a connection
query_wait_timeout = 120

; Client idle timeout (seconds) - disconnect clients after idle (0 = disabled)
client_idle_timeout = 0

; Idle transaction timeout (seconds) - kill transactions that are idle
idle_transaction_timeout = 300

;;; Logging

; Log connections/disconnections (0/1)
log_connections = 0
log_disconnections = 0

; Log pooler errors (0/1)
log_pooler_errors = 1

; Log stats interval (0 = disabled)
log_stats = 60

;;; Performance tuning

; DNS lookup caching time (seconds)
dns_max_ttl = 15

; DNS lookup negative result caching time (seconds)
dns_nxdomain_ttl = 15

; Prepared statement handling in transaction mode
; Disable to avoid issues with transaction pooling
max_prepared_statements = 0

;;; Administrative access
; Users that can access admin console via pgbouncer database
admin_users = postgres

; Users that can access stats via pgbouncer database
stats_users = postgres, monitoring

;;; Include additional configuration
; %include /etc/pgbouncer/pgbouncer-custom.ini
