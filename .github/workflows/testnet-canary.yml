name: Testnet Canary (fixture)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/testnet-canary.ts"
      - "scripts/fixtures/testnet-canary-fixture.json"
      - ".github/workflows/testnet-canary.yml"

jobs:
  fixture-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Run fixture canary
        run: npx tsx scripts/testnet-canary.ts --fixture --run-id ci-${{ github.run_id }}
