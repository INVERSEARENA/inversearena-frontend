name: Ops CLI CI

on:
  push:
    branches: ["main"]
    paths:
      - "tools/ops-cli/**"
      - "contract/deployment-manifest.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ops-cli-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/ops-cli/**"
      - "contract/deployment-manifest.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ops-cli-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./tools/ops-cli

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @inversearena/ops-cli...

      - name: Typecheck
        run: pnpm --filter @inversearena/ops-cli run typecheck

      # #1648: argument encoding, manifest, signer, mainnet safety, event
      # decoding and the dry-run/submit flow. The local-network smoke test
      # needs Docker and is run with `pnpm --filter @inversearena/ops-cli run test:smoke` (see README).
      - name: Unit tests
        run: pnpm --filter @inversearena/ops-cli test

      - name: Build
        run: pnpm --filter @inversearena/ops-cli run build && node tools/ops-cli/dist/cli.js --help
