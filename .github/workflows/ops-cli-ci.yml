name: Ops CLI CI

on:
  push:
    branches: ["main"]
    paths:
      - "tools/ops-cli/**"
      - "contract/deployment-manifest.json"
      - ".github/workflows/ops-cli-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "tools/ops-cli/**"
      - "contract/deployment-manifest.json"
      - ".github/workflows/ops-cli-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./tools/ops-cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: tools/ops-cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # #1648: argument encoding, manifest, signer, mainnet safety, event
      # decoding and the dry-run/submit flow. The local-network smoke test
      # needs Docker and is run with `npm run test:smoke` (see README).
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build && node dist/cli.js --help
