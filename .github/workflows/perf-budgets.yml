name: Performance Budgets Gate

on:
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "backend/**"
      - "contract/**"
      - "scripts/**"
      - ".github/workflows/perf-budgets.yml"

jobs:
  evaluate-perf-budgets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run Performance Budget Evaluation
        run: |
          npx tsx scripts/check-perf-budgets.ts

      - name: Upload Budget Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-budget-report
          path: target/perf-budgets/
          if-no-files-found: ignore
