name: Contract CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - "contract/**"
      - ".github/workflows/contract-ci.yml"

jobs:
  test-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add wasm32 targets
        run: |
          rustup target add wasm32-unknown-unknown
          rustup target add wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contract/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Soroban CLI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev libusb-1.0-0-dev

      - name: Build arena WASM
        working-directory: ./contract
        run: cargo build -p arena --target wasm32v1-none --release
        # arena/src/integration_tests.rs embeds this crate's own compiled WASM
        # (via crate::WASM) to test the factory's real dynamic-deployment path,
        # so it must exist before `cargo test` compiles that test module.
        # - Scoped to -p arena: a whole-workspace wasm build currently fails
        #   separately (factory statically links arena and both export an
        #   `unpause` symbol, colliding when factory's wasm links arena's code
        #   in) — a pre-existing, unrelated issue not fixed here.
        # - wasm32v1-none, not wasm32-unknown-unknown: the latter can emit
        #   reference-types instructions that soroban-env-host rejects at
        #   runtime ("reference-types not enabled").

      - name: Run contract tests
        working-directory: ./contract
        run: cargo test --workspace

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Optimize contract WASM and enforce size budget
        working-directory: ./contract
        run: ./scripts/optimize_and_check_wasm.sh

      - name: Upload WASM size metrics
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm-size-metrics
          path: contract/target/wasm-metrics/sizes.md
          if-no-files-found: error

      - name: Build contract docs
        working-directory: ./contract
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps
